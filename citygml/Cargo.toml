[package]
name = "citygml"
version = "0.1.1"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/citygml"
homepage = "https://github.com/openbimrs/citygml"
documentation = "https://docs.rs/citygml"
readme = "README.md"
description = "Short-name pure re-export of the reserved OpenBIM.rs CityGML scaffold."
keywords = ["citygml", "openbim", "geospatial", "city-model"]
categories = ["science::geo"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE", "LICENSES/MIT.txt", "LICENSES/LicenseRef-Commercial.txt"]
publish = true

[dependencies]
openbim-citygml = { version = "=0.1.1", path = "../openbim-citygml" }
